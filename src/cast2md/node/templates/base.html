<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171615" media="(prefers-color-scheme: dark)">
    <title>{% block title %}cast2md node{% endblock %}</title>
    <script>
        (function () {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'auto');
        })();
    </script>
    <link rel="stylesheet" href="/static/homelab.css?v=modernist-3">
    <link rel="stylesheet" href="/static/app.css?v=modernist-3">
</head>
<body>
    {% set path = request.url.path %}
    <nav class="nav" aria-label="Node navigation">
        <a class="nav-brand" href="/">cast2md <span class="house">node</span></a>
        <a href="/" {% if path == '/' %}aria-current="page"{% endif %}>Status</a>
        <a href="/queue" {% if path == '/queue' %}aria-current="page"{% endif %}>Queue</a>
        <a href="/settings" {% if path == '/settings' %}aria-current="page"{% endif %}>Settings</a>
        {% if config and config.server_url %}<span class="nav-end"><a class="btn btn-ghost compact" href="{{ config.server_url }}" target="_blank" rel="noopener">Server</a></span>{% endif %}
    </nav>
    <main class="app-main">{% block content %}{% endblock %}</main>
    <footer class="footer"><span class="note">cast2md — Transcriber Node</span></footer>
    <script>
        function setTheme(theme) {
            const value = ['auto', 'light', 'dark'].includes(theme) ? theme : 'auto';
            document.documentElement.setAttribute('data-theme', value);
            localStorage.setItem('theme', value);
        }
        document.addEventListener('DOMContentLoaded', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'auto';
            document.querySelectorAll('[name="theme"]').forEach((input) => {
                input.checked = input.value === current;
                input.addEventListener('change', () => setTheme(input.value));
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
