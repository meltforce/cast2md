{% extends "base.html" %}

{% block title %}Admin - cast2md{% endblock %}

{% block content %}
<div class="admin-layout">
    <aside class="rail admin-rail desktop-only" aria-label="Admin navigation">
        <a class="rail-item" href="/admin" {% if request.url.path == '/admin' %}aria-selected="true"{% endif %}>Status</a>
        <a class="rail-item" href="/admin/queue" {% if request.url.path == '/admin/queue' %}aria-selected="true"{% endif %}>Queue</a>
        <a class="rail-item" href="/admin/runpod" {% if request.url.path == '/admin/runpod' %}aria-selected="true"{% endif %}>RunPod</a>
        <a class="rail-item" href="/admin/settings" {% if request.url.path == '/admin/settings' %}aria-selected="true"{% endif %}>Settings</a>
        <a class="rail-item" href="/docs" target="_blank">API Docs</a>
    </aside>
    <div class="admin-content">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
