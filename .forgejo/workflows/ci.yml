name: ci

on:
  push:
    branches: [main]
    tags:    ['[0-9]+.[0-9]+*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Validate package builds
        run: uv build

  build-deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: meltforce.net/ci-workflows/.forgejo/workflows/build-push-deploy.yml@v1
    with:
      app_name: cast2md
      target_host: cast2md.coydog-fence.ts.net
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  build-afterburner:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       contains(toJSON(github.event.commits.*.modified), 'deploy/afterburner/Dockerfile'))
      || github.event_name == 'workflow_dispatch'
    runs-on: docker-buildx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: deploy/afterburner
          push: true
          tags: |
            meltforce/cast2md-afterburner:latest
            meltforce/cast2md-afterburner:cuda124
            meltforce/cast2md-afterburner:${{ github.sha }}
          no-cache: true

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: docker-buildx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: meltforce
          password: ${{ secrets.GH_PAT }}
      - name: Build + push release image to ghcr.io
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/meltforce/cast2md:latest
            ghcr.io/meltforce/cast2md:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Build + publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv build
          uv publish

      # The tag has to exist on GitHub before the release can reference it.
      # Forgejo is canonical; GitHub gets the tag via the push-mirror, which is
      # asynchronous — so wait rather than assume.
      - name: Wait for tag to propagate to GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          for i in $(seq 1 10); do
            if curl -sSf -H "Authorization: token ${GH_PAT}" \
                 "https://api.github.com/repos/meltforce/cast2md/git/ref/tags/${TAG}" > /dev/null; then
              echo "Tag ${TAG} is on GitHub."
              exit 0
            fi
            echo "Tag not yet on GitHub (attempt $i/10), sleeping 30s..."
            sleep 30
          done
          echo "Tag never appeared on GitHub within 5 minutes — failing." >&2
          exit 1

      - name: Create GitHub release
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_PAT" || { echo "GH_PAT empty"; exit 1; }
          TAG="${{ github.ref_name }}"
          PREV=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || echo "")
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git log "${PREV}..${TAG}" --pretty=format:'- %s (%an)' --no-merges)
          else
            CHANGELOG=$(git log "${TAG}" --pretty=format:'- %s (%an)' --no-merges | head -50)
          fi
          BODY=$(jq -Rsa . <<EOF
          ## Changes since ${PREV:-the beginning}

          ${CHANGELOG}

          ## Installation

          \`\`\`bash
          docker pull ghcr.io/meltforce/cast2md:${TAG}
          # or
          pip install cast2md==${TAG}
          \`\`\`
          EOF
          )
          curl -fsSL -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":${BODY},\"draft\":false,\"prerelease\":false}" \
            "https://api.github.com/repos/meltforce/cast2md/releases"

  docs:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs (Zensical)
        run: |
          set -euxo pipefail
          pip install zensical
          zensical build
          ls -la site | head -20
      - name: Add CNAME for GitHub Pages
        run: |
          echo 'cast2md.meltforce.org' > site/CNAME
          # Jekyll would swallow every path starting with an underscore.
          touch site/.nojekyll
      # Pushed to Forgejo, not to GitHub: der Push-Mirror ist `git push --mirror`
      # und prunet jeden Ref, den es lokal nicht gibt. Ein nur auf GitHub
      # existierender gh-pages-Branch würde beim nächsten Sync gelöscht.
      - name: Push to gh-pages branch (Forgejo → Mirror → GitHub)
        env:
          FJ_PUSH_TOKEN: ${{ secrets.FJ_PUSH_TOKEN }}
        run: |
          # Kein -x: der Push-URL enthält den Token, und ein Trace davon steht
          # ungefiltert im Job-Log. Der Presence-Guard darunter ist das, was der
          # Incident vom 2026-05-14 eigentlich wollte — nicht der Trace.
          set -euo pipefail
          test -n "$FJ_PUSH_TOKEN" || { echo "FJ_PUSH_TOKEN empty"; exit 1; }
          cd site
          git init
          git config user.email "25252086+meltforce@users.noreply.github.com"
          git config user.name  "cast2md ci"
          git checkout -b gh-pages
          git add -A
          git commit -m "docs: build from ${GITHUB_SHA::7}"
          git push -f "https://${FJ_PUSH_TOKEN}@git.coydog-fence.ts.net/meltforce.net/cast2md.git" gh-pages
