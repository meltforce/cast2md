name: ci

on:
  push:
    branches: [main]
    tags:    ['[0-9]+.[0-9]+*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Drives deploy-freshness below, and nothing else. Every four hours at :17,
  # off the top of the hour so it does not queue behind whatever else fires
  # there. A scheduled run is created on the default branch, which is what makes
  # github.sha the head of main without an API call.
  schedule:
    - cron: '17 */4 * * *'

# No `permissions:` block: Forgejo does not support it and logs a warning
# for every job in the run, including the jobs of any reusable workflow this
# one calls. Capabilities come from Authorized Integrations instead. These
# workflows live under .forgejo/ and never run on GitHub, so the field had
# no effect anywhere.

# Queue runs of this workflow per ref instead of letting a new push abort the
# one in flight. Forgejo aborted running push runs unconditionally up to v12
# (forgejo#5914, "can lead to partial and broken deploys"); `concurrency` became
# configurable in v14, and this instance is on 16.0.2.
#
# That is not theoretical here: on 2026-08-06 the deploy of 730bdd7 ended as
# `cancelled` because the next commit landed four minutes later, so production
# stayed on the previous image with nothing red to show for it. `cancelled` is a
# third outcome next to success and failure, and deploy-gate cannot report on a
# run that was killed before its jobs started -- see homelab/INCIDENTS.md,
# 2026-08-01 (afternoon).
#
# Workflow scope rather than job scope: deploy-gate compares the running build
# against github.sha, so a second deploy must not start while the first run's
# gate is still checking. Serialising the whole run keeps that comparison
# meaningful. The group includes the ref, so a PR never queues behind main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Validate package builds
        run: uv build

  test:
    runs-on: docker
    # 68 of the 117 tests take a real database: their fixtures open a
    # connection at setup and fail with "DATABASE_URL environment variable is
    # required" without one. pgvector rather than plain postgres because the
    # search schema declares vector(384) columns.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cast2md
          POSTGRES_USER: cast2md
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U cast2md"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cast2md:ci@postgres:5432/cast2md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test
        run: uv run pytest -q

  build-deploy:
    needs: [build, test]
    # NO github.event_name comparison here: on a `uses:` job the condition is
    # evaluated in the *called* workflow, where the event is named
    # `workflow_call`. It was therefore never true — build and deploy were
    # silently skipped from early June 2026 on, while the caller kept
    # reporting "success", and :edge stayed frozen at 2026-05-11.
    # github.ref stays correct and is refs/pull/N/merge on PRs.
    # (The conditions on the ordinary jobs below are unaffected — those run in
    # their own workflow context.)
    if: github.ref == 'refs/heads/main'
    uses: meltforce.net/ci-workflows/.forgejo/workflows/build-push-deploy.yml@v4
    with:
      app_name: cast2md
      target_host: cast2md.coydog-fence.ts.net
      # Without this the reusable workflow's own health step is skipped
      # (`if: inputs.health_url != ''`), and `deploy` reports success on the
      # strength of `docker compose up -d` returning. deploy-gate below still
      # catches it, but a job later and only after its own polling — this
      # fails the deploy itself. vimmary had the same gap and it cost an
      # outage on 2026-08-06.
      health_url: https://cast2md.coydog-fence.ts.net/api/health
      # homelab/Ansible owns the deployed compose
      # (homelab/docker/stacks/cast2md/compose.yaml), and Compose resolves
      # compose.yaml ahead of docker-compose.yml, so a synced file would sit
      # unused beside the real one as a second source of truth.
      # v1 carried no compose-sync step at all; this keeps the behaviour
      # the version bump would otherwise have changed silently.
      sync_compose: false
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      # v2 added an authenticated Docker Hub login against the anonymous 429
      # rate limit, and docker/login-action fails the job outright when the
      # username is empty. Omitting these two is what froze :edge from
      # 2026-08-06 to 2026-08-07 -- see homelab/INCIDENTS.md.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-gate:
    # Turns a skipped deploy into a red pipeline. Without this job, a
    # `build-deploy` that never ran is indistinguishable from one that
    # succeeded: a `uses:` job whose `if:` evaluates false is reported as
    # `skipped`, and a skipped job does not fail the workflow. That is exactly
    # how build and deploy went unnoticed for two months in 2026 (see the
    # comment on build-deploy and the pointer in INCIDENTS.md).
    #
    # The github.event_name comparison IS correct here, unlike on build-deploy:
    # this is an ordinary `runs-on:` job, so its condition is evaluated in this
    # workflow's context where the event really is `push`. Do not remove it --
    # without it the job would fail every pull request, where build-deploy is
    # skipped by design.
    needs: [build-deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: docker
    steps:
      - name: Require build-deploy to have run
        env:
          RESULT: ${{ needs.build-deploy.result }}
        run: |
          set -euo pipefail
          echo "build-deploy result: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            echo "::error::build-deploy did not run to success (result: ${RESULT})."
            echo "A 'skipped' result means the job's if: condition was false --"
            echo "check whether it compares github.event_name, which is"
            echo "'workflow_call' inside the called workflow and never 'push'."
            exit 1
          fi

      - name: Verify this commit is the one serving
        env:
          # What the build arg becomes: build-push-deploy.yml passes
          # VERSION=edge-<sha>, the Dockerfile puts it in CAST2MD_BUILD_VERSION,
          # and /api/health reports it as `build`.
          EXPECTED: edge-${{ github.sha }}
        run: |
          set -euo pipefail
          # A green build-deploy is not proof the new image is running: if the
          # push left :edge pointing at the old image, `docker compose pull`
          # fetches that one, `up -d` reports up-to-date, and health is green
          # over a deploy that changed nothing. Comparing the build string is
          # what separates "deployed" from "still the previous commit".
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 10 https://cast2md.coydog-fence.ts.net/api/health || true)"
            # Tolerates whitespace around the colon: FastAPI emits compact JSON,
            # but nothing in the contract promises it stays that way.
            got="$(printf '%s' "${body}" \
                   | sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            if [ "${got}" = "${EXPECTED}" ]; then
              case "${body}" in
                *'"status":"healthy"'*)
                  echo "serving ${got}, healthy"
                  exit 0
                  ;;
              esac
              echo "attempt ${attempt}: right build, not healthy yet"
            else
              echo "attempt ${attempt}: build is '${got:-unknown}', want '${EXPECTED}'"
            fi
            sleep 10
          done
          echo "::error::After 60s, /api/health does not report a healthy ${EXPECTED}."
          echo "A different build string means the deploy ran but the new image"
          echo "never reached the host — check whether :edge was actually moved."
          echo "It can also mean a later push overtook this run; compare the SHAs."
          exit 1

  build-afterburner:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       contains(toJSON(github.event.commits.*.modified), 'deploy/afterburner/Dockerfile'))
      || github.event_name == 'workflow_dispatch'
    runs-on: docker-buildx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: deploy/afterburner
          push: true
          tags: |
            meltforce/cast2md-afterburner:latest
            meltforce/cast2md-afterburner:cuda124
            meltforce/cast2md-afterburner:${{ github.sha }}
          no-cache: true

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: docker-buildx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: meltforce
          password: ${{ secrets.GH_PAT }}
      - name: Build + push release image to ghcr.io
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/meltforce/cast2md:latest
            ghcr.io/meltforce/cast2md:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Build + publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv build
          uv publish

      # The tag has to exist on GitHub before the release can reference it.
      # Forgejo is canonical; GitHub gets the tag via the push-mirror, which is
      # asynchronous — so wait rather than assume.
      - name: Wait for tag to propagate to GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          for i in $(seq 1 10); do
            if curl -sSf -H "Authorization: token ${GH_PAT}" \
                 "https://api.github.com/repos/meltforce/cast2md/git/ref/tags/${TAG}" > /dev/null; then
              echo "Tag ${TAG} is on GitHub."
              exit 0
            fi
            echo "Tag not yet on GitHub (attempt $i/10), sleeping 30s..."
            sleep 30
          done
          echo "Tag never appeared on GitHub within 5 minutes — failing." >&2
          exit 1

      - name: Create GitHub release
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_PAT" || { echo "GH_PAT empty"; exit 1; }
          TAG="${{ github.ref_name }}"
          PREV=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || echo "")
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git log "${PREV}..${TAG}" --pretty=format:'- %s (%an)' --no-merges)
          else
            CHANGELOG=$(git log "${TAG}" --pretty=format:'- %s (%an)' --no-merges | head -50)
          fi
          BODY=$(jq -Rsa . <<EOF
          ## Changes since ${PREV:-the beginning}

          ${CHANGELOG}

          ## Installation

          \`\`\`bash
          docker pull ghcr.io/meltforce/cast2md:${TAG}
          # or
          pip install cast2md==${TAG}
          \`\`\`
          EOF
          )
          curl -fsSL -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":${BODY},\"draft\":false,\"prerelease\":false}" \
            "https://api.github.com/repos/meltforce/cast2md/releases"

  docs:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs (Zensical)
        run: |
          set -euxo pipefail
          pip install zensical
          zensical build
          ls -la site | head -20
      - name: Add CNAME for GitHub Pages
        run: |
          echo 'cast2md.meltforce.org' > site/CNAME
          # Jekyll would swallow every path starting with an underscore.
          touch site/.nojekyll
      # Pushed to Forgejo, not to GitHub: the push-mirror runs
      # `git push --mirror` and prunes every ref absent on Forgejo. A gh-pages
      # branch existing only on GitHub is deleted on the next sync.
      - name: Push to gh-pages branch (Forgejo → Mirror → GitHub)
        env:
          FJ_PUSH_TOKEN: ${{ secrets.FJ_PUSH_TOKEN }}
        run: |
          # No -x: the push URL embeds the token, and a trace of it lands
          # unfiltered in the job log. The presence guard below is what the
          # 2026-05-14 incident actually called for; the trace was not.
          set -euo pipefail
          test -n "$FJ_PUSH_TOKEN" || { echo "FJ_PUSH_TOKEN empty"; exit 1; }
          cd site
          git init
          git config user.email "25252086+meltforce@users.noreply.github.com"
          git config user.name  "cast2md ci"
          git checkout -b gh-pages
          git add -A
          git commit -m "docs: build from ${GITHUB_SHA::7}"
          git push -f "https://${FJ_PUSH_TOKEN}@git.coydog-fence.ts.net/meltforce.net/cast2md.git" gh-pages

  deploy-freshness:
    # Answers the question deploy-gate cannot: is production still serving the
    # head of main, hours or days after the push that deployed it?
    #
    # deploy-gate checks the same thing, but only inside the run that deployed.
    # When CI itself is broken, no run happens and no gate fires. On 2026-08-06 a
    # version bump of the shared deploy workflow added a required Docker Hub
    # secret this repo did not pass, every run went red, and production served a
    # commit 16 behind main for a day. deploy-gate reported it correctly, as a
    # red run in a list, which produces no mail and no push.
    #
    # The signal is a heartbeat to an Uptime Kuma push monitor rather than the
    # job's own exit status, because the failure to catch is silence. Three
    # cases, three outcomes:
    #
    #   production matches main  -> ping status=up, monitor stays green
    #   production is behind     -> ping status=down, Kuma alerts immediately
    #   this job never runs      -> no ping, Kuma alerts once its interval
    #                               (7h, against this 4h schedule) elapses
    #
    # The third case is the one that matters and the reason for a push monitor:
    # a broken workflow file, a dead runner or a Forgejo outage all stop the
    # check, and all of them look identical to "nothing to report" without it.
    #
    # Monitor and notification routing: homelab, configuration/uptimekuma,
    # "cast2md - deploy freshness". Postmortem: homelab/INCIDENTS.md 2026-08-07.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: docker
    steps:
      - name: Compare the running build against the head of main
        env:
          # A scheduled run is created on the default branch, so github.sha is
          # already main's head; the deployed string is edge-<sha>, set by
          # build-push-deploy.yml as VERSION and reported by /api/health.
          EXPECTED: edge-${{ github.sha }}
          PUSH_URL: ${{ secrets.KUMA_DEPLOY_PUSH_URL }}
        run: |
          # No -x: PUSH_URL embeds the monitor token, and a trace would put it
          # in the job log unfiltered. Same reason as the docs job above.
          set -euo pipefail
          test -n "${PUSH_URL}" || {
            echo "::error::KUMA_DEPLOY_PUSH_URL is empty."
            echo "Without it this job cannot signal, and the monitor will alert"
            echo "on the missing heartbeat instead. The value is in setec as"
            echo "cast2md/uptime-kuma-deploy-freshness-push-url."
            exit 1
          }

          # Retry rather than judge on one reading: a schedule that fires while a
          # deploy is in flight would otherwise report a stale build for a
          # difference that resolves in seconds.
          got=""
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 10 https://cast2md.coydog-fence.ts.net/api/health || true)"
            got="$(printf '%s' "${body}" \
                   | sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            [ "${got}" = "${EXPECTED}" ] && break
            echo "attempt ${attempt}: serving '${got:-unknown}', main is '${EXPECTED}'"
            sleep 10
          done

          base="${PUSH_URL%%\?*}"
          if [ "${got}" = "${EXPECTED}" ]; then
            echo "production serves ${got}, which is the head of main"
            curl -fsS --max-time 10 -o /dev/null \
              "${base}?status=up&msg=$(printf '%s' "${got}" | sed 's/[^A-Za-z0-9-]/%20/g')"
            exit 0
          fi

          echo "::error::Production serves '${got:-unknown}', main is '${EXPECTED}'."
          echo "The deploy chain has stopped moving :edge. Check the run list for"
          echo "a failing build-deploy, and homelab/INCIDENTS.md 2026-08-07 for the"
          echo "shape this took last time."
          curl -fsS --max-time 10 -o /dev/null \
            "${base}?status=down&msg=stale%3A%20serving%20${got:-unknown}" || true
          exit 1
